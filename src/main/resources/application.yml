server:
  port: 8090

spring:
  application:
    name: act-mcp
  datasource:
    url: jdbc:sqlite:./data/act-mcp.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-init-sql: PRAGMA foreign_keys = ON
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
  ai:
    mcp:
      server:
        name: act-mcp
        version: 1.0.0
        protocol: STREAMABLE
        instructions: |
          活动管理 MCP 服务，可管理大活动和商品活动。
          act_type 编码：1=满减活动，2=折扣活动，3=秒杀活动，4=优惠券活动，5=组合优惠。
          audience_scope：ALL=所有用户，NEW=新客。
          时间格式：yyyy-MM-ddTHH:mm。
          写操作请通过 operator 参数提供操作人名称；未提供时记为 mcp-agent。
        annotation-scanner:
          enabled: false
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: mappings
  endpoint:
    mappings:
      enabled: true

logging:
  level:
    com.actmcp: INFO
    org.springframework.ai: DEBUG
